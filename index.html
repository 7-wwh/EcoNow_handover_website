<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNow 25/26 | Strategic Handover</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-color: #556b2f;
      --text-color: #1a1a1a;
      /* Default entrance point */
      --clip-x: 50vw;
      --clip-y: 50vh;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Typography Animations */
    .insane-text .char {
      display: inline-block;
      opacity: 0;
      transform: rotateX(-90deg) translateY(20px);
      filter: blur(10px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity, filter;
    }
    .insane-text.animate-in .char {
      opacity: 1;
      transform: rotateX(0) translateY(0);
      filter: blur(0);
    }

    .delay-1 {
      animation-delay: 0.2s;
    }

    .delay-2 {
      animation-delay: 0.4s;
    }

    .delay-3 {
      animation-delay: 0.6s;
    }

    /* Input Field Animation */
    #emailInput {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.05em;
    }

    #emailInput:focus {
      letter-spacing: 0.15em;
      border-color: var(--accent-color);
    }

    /* Candle Interaction */
    .flame-group {
      transition: opacity 0.3s ease;
      transform-origin: 50% 100%;
    }

    .candle-wrap:hover .flame-group {
      opacity: 0.4;
      transform: scale(0.9);
    }

    /* Transition Overlay */
    #transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--accent-color);
      z-index: 1000;
      pointer-events: none;
      /* Initially covers the screen */
      clip-path: circle(150% at var(--clip-x) var(--clip-y));
      transition: clip-path 1.2s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* When 'revealed' class is added, it shrinks to 0 (shows page) */
    #transition-overlay.revealed {
      clip-path: circle(0% at var(--clip-x) var(--clip-y));
    }

    .btn-interact {
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-interact:hover {
      background-color: var(--accent-color);
      color: white;
      letter-spacing: 0.2em;
    }
  </style>
</head>

<body class="flex flex-col justify-center px-8 md:px-24">

  <!-- Ambient Candle -->
  <div class="fixed top-8 right-8 candle-wrap cursor-pointer" id="candleWrap">
    <svg width="40" height="50" viewBox="0 0 74 90">
      <g class="flame-group">
        <path
          d="M37,66 C24,66 14,56 15,42 C16,32 24,28 20,16 C28,20 30,28 27,34 C34,18 40,10 36,0 C50,10 54,24 46,34 C56,32 60,42 52,52 C48,60 42,66 37,66 Z"
          fill="#556b2f" />
      </g>
    </svg>
  </div>

  <main class="max-w-xl">
    <div class="space-y-6">
      <div class="insane-text flex items-center gap-4" id="header-meta">
        <div class="w-12 h-[2px] bg-[var(--accent-color)]"></div>
        <span class="text-xs font-bold tracking-[0.3em] uppercase text-[var(--accent-color)]">
          Strategic Handover
        </span>
      </div>

      <h1 class="insane-text text-6xl md:text-8xl font-black tracking-tighter leading-[0.9] text-gray-900" id="header-main">
        ECONOW <br>
        <span class="text-[var(--accent-color)]">25/26</span>
      </h1>

      <p
        class="insane-text text-lg md:text-xl font-light text-gray-600 tracking-tight max-w-md leading-relaxed" id="header-sub">
        A legacy defined by purpose. Enter your Enactus credential to begin the handover documentation.
      </p>
    </div>

    <div class="insane-text mt-12 space-y-6 max-w-sm" id="header-cta">
      <div class="relative">
        <input type="text" id="emailInput" placeholder="Your Enactus Email"
          class="w-full bg-transparent border-b-2 border-gray-300 py-3 text-lg outline-none focus:border-[var(--accent-color)] placeholder-gray-400 transition-all">
      </div>
      <div id="statusMsg" class="text-sm font-medium text-red-600 h-6"></div>

      <button id="cta-button" class="px-8 py-4 font-bold tracking-widest uppercase btn-interact w-full">
        Enter Booklet
      </button>
    </div>
  </main>

  <div id="transition-overlay"></div>

  <script>
    const button = document.getElementById('cta-button');
    const overlay = document.getElementById('transition-overlay');
    const emailInput = document.getElementById('emailInput');
    const statusMsg = document.getElementById('statusMsg');
    const EMAIL_PATTERN = /^[a-zA-Z0-9._-]+\.enactusunm@gmail\.com$/i;

    // Track cursor for entry animation
    window.addEventListener('mousemove', (e) => {
      // Only update until overlay reveals itself
      if (!overlay.classList.contains('revealed')) {
        document.documentElement.style.setProperty('--clip-x', `${e.clientX}px`);
        document.documentElement.style.setProperty('--clip-y', `${e.clientY}px`);
      }
    });

    // Entrance animation on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        overlay.classList.add('revealed');
      }, 500);
      
      // Initialize text animations
      document.querySelectorAll('.insane-text').forEach(el => {
        const html = el.innerHTML;
        // Simple way to handle <br>
        const parts = html.split('<br>');
        el.innerHTML = parts.map(part => {
          return part.trim().split('').map((char, i) =>
            char === ' ' ? '&nbsp;' : `<span class="char" style="transition-delay: ${i * 0.03}s">${char}</span>`
          ).join('');
        }).join('<br>');
        
        setTimeout(() => el.classList.add('animate-in'), 800);
      });
    });

    // Button exit animation
    button.addEventListener('click', () => {
      const val = emailInput.value.trim();
      if (EMAIL_PATTERN.test(val)) {
        // Update coordinates to button center for exit
        const rect = button.getBoundingClientRect();
        document.documentElement.style.setProperty('--clip-x', `${rect.left + rect.width / 2}px`);
        document.documentElement.style.setProperty('--clip-y', `${rect.top + rect.height / 2}px`);

        statusMsg.textContent = "";
        overlay.classList.remove('revealed');

        setTimeout(() => {
          // Store button coordinates before redirect
          const styles = getComputedStyle(document.documentElement);
          sessionStorage.setItem('clip-x', styles.getPropertyValue('--clip-x'));
          sessionStorage.setItem('clip-y', styles.getPropertyValue('--clip-y'));
          window.location.href = 'main.html';
        }, 1200);
      } else {
        statusMsg.textContent = "Invalid credential format.";
        emailInput.classList.add('border-red-500');
      }
    });

    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('border-red-500');
      statusMsg.textContent = "";
    });
  </script>
</body>

</html>
