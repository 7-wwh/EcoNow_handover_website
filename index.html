<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoNow Access</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; background-color: var(--ink); color: var(--paper); }
        .login-box { text-align: center; padding: 40px; }
        h1 { font-family: 'Big Shoulders Display', sans-serif; color: var(--wax-light); margin-bottom: 30px; }
        input { padding: 12px; border: 1px solid var(--line); border-radius: 4px; width: 300px; display: block; margin: 0 auto 20px; font-family: 'Space Mono', monospace; }
        button { padding: 12px 30px; background: var(--wax); color: white; border: none; border-radius: 4px; cursor: pointer; font-family: 'Space Mono', monospace; }
        #error { color: #a53d2b; margin-top: 15px; font-family: 'Space Mono', monospace; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>EcoNow Access</h1>
        <input type="email" id="email" placeholder="xxxx.enactusunm@gmail.com">
        <button onclick="checkEmail()">Enter</button>
        <p id="error"></p>
    </div>
    <script>
        function checkEmail() {
            const email = document.getElementById('email').value;
            const regex = /^.+\.enactusunm@gmail\.com$/;
            if (regex.test(email)) {
                sessionStorage.setItem('authorized', 'true');
                window.location.href = 'main.html';
            } else {
                document.getElementById('error').innerText = 'Invalid email address.';
            }
        }
    </script>
</body>
</html>
