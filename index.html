<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNow 25/26 | My experience with </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/gatekeeper.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-color: #556b2f;
      --accent-muted: rgba(85, 107, 47, 0.15);
      --text-color: #1a1a1a;
      --bg-color: #FCFBF9; /* Warm, premium alabaster */
      /* Default entrance point */
      --clip-x: 50vw;
      --clip-y: 50vh;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Typography Animations */
    .reveal-item {
      opacity: 0;
      transform: translateY(20px);
      animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes revealUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }

    /* Elegant Input Interaction */
    .input-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background-color: var(--accent-color);
      transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .input-wrapper:focus-within::after {
      width: 100%;
      left: 0;
    }

    #emailInput {
      transition: all 0.4s ease;
    }

    #emailInput:focus {
      padding-left: 4px;
    }

    /* Transition Overlay */
    #transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--accent-color);
      z-index: 1000;
      pointer-events: none;
      clip-path: circle(150% at var(--clip-x) var(--clip-y));
      transition: clip-path 1.2s cubic-bezier(0.76, 0, 0.24, 1);
    }

    #transition-overlay.revealed {
      clip-path: circle(0% at var(--clip-x) var(--clip-y));
    }

    /* Editorial Style Button */
    .btn-interact {
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      background-color: transparent;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-interact:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      letter-spacing: 0.15em;
      box-shadow: 0 4px 20px var(--accent-muted);
    }

    .btn-interact:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
      background-color: transparent;
      color: var(--accent-color);
    }

    /* Smooth Spinner Fade */
    #btn-spinner {
      transition: opacity 0.3s ease, width 0.3s ease;
    }
  </style>
</head>

<body class="flex flex-col justify-center px-8 md:px-24">

  <main class="max-w-xl">
    <div class="space-y-6">
      <div class="reveal-item flex items-center gap-4">
        <div class="w-8 h-[1px] bg-[var(--accent-color)] opacity-60"></div>
        <span class="text-[10px] font-bold tracking-[0.4em] uppercase text-[var(--accent-color)]">
          Looking back at
        </span>
      </div>

      <h1 class="reveal-item delay-1 text-5xl md:text-7xl font-extrabold tracking-tight leading-[0.95] text-stone-900">
        ECONOW <br>
        <span class="text-[var(--accent-color)] font-light">25/26</span>
      </h1>

      <p
        class="reveal-item delay-2 text-base md:text-lg font-light text-stone-500 tracking-tight max-w-sm leading-relaxed">
        A quiet space documenting plans, thoughts, people, and archival memories with my wonderful team.
      </p>
    </div>

    <div class="reveal-item delay-3 mt-14 space-y-5 max-w-xs">
      <div class="relative input-wrapper border-b border-stone-200 pb-1">
        <input type="text" id="emailInput" placeholder="Enactus Email Address"
          class="w-full bg-transparent py-2 text-sm outline-none placeholder-stone-400 text-stone-800 tracking-wide">
      </div>
      
      <!-- Subtle Error Message Area -->
      <div id="statusMsg" class="text-xs font-medium text-red-700/80 h-4 transition-all duration-300"></div>

      <button id="cta-button" class="py-3.5 text-xs font-semibold tracking-widest uppercase btn-interact w-full flex items-center justify-center gap-2 rounded-sm">
        <svg id="btn-spinner" class="animate-spin h-3.5 w-3.5 text-current hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="btn-text">Enter Booklet</span>
      </button>
    </div>
  </main>

  <div id="transition-overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQNd1bQWwvkeOud5ROhlLiCUGTchJTblM",
      authDomain: "econow2526.firebaseapp.com",
      projectId: "econow2526",
      storageBucket: "econow2526.firebasestorage.app",
      messagingSenderId: "514653585801",
      appId: "1:514653585801:web:25021a25966df011f76158",
      measurementId: "G-ZHPJDXJ65H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const button = document.getElementById('cta-button');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const overlay = document.getElementById('transition-overlay');
    const emailInput = document.getElementById('emailInput');
    const statusMsg = document.getElementById('statusMsg');
    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const ALLOWED_EMAIL_PATTERN = /^[a-zA-Z0-9._%+-]+\.enactusunm@gmail\.com$/i;

    // Helper: Fetches user's public IP address via ipify API
    async function fetchUserIp() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        if (response.ok) {
          const data = await response.json();
          return data.ip || 'Unknown';
        }
      } catch (error) {
        console.warn("Failed to fetch public IP (Likely blocked by browser extension/adblocker). Proceeding with fallback.", error);
      }
      return 'Unknown';
    }

    // Helper: Gets or generates a unique long-term device ID saved in localStorage
    function getDeviceID() {
      let deviceId = localStorage.getItem('econow_device_id');
      if (!deviceId) {
        // Generate a random ID prefixed with dev_ and timestamp
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('econow_device_id', deviceId);
      }
      return deviceId;
    }

    // Save payload to firestore containing the email, timestamp, user agent, ip and deviceId
    async function saveEmailToFirestore(email, ipAddress, deviceId) {
      await addDoc(collection(db, "user_emails"), {
        email,
        timestamp: new Date(),
        userAgent: navigator.userAgent,
        ipAddress,
        deviceId
      });
    }

    // Track cursor for entry animation
    window.addEventListener('mousemove', (e) => {
      // Only update until overlay reveals itself
      if (!overlay.classList.contains('revealed')) {
        document.documentElement.style.setProperty('--clip-x', `${e.clientX}px`);
        document.documentElement.style.setProperty('--clip-y', `${e.clientY}px`);
      }
    });

    // Entrance animation on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        overlay.classList.add('revealed');
      }, 500);
    });

    button.addEventListener('click', async () => {
      const val = emailInput.value.trim();

      if (!EMAIL_PATTERN.test(val)) {
        statusMsg.textContent = "Invalid credential format.";
        emailInput.classList.add('border-red-700/50');
        return;
      }

      if (!ALLOWED_EMAIL_PATTERN.test(val)) {
        statusMsg.textContent = "Only official Enactus Email is permitted.";
        emailInput.classList.add('border-red-700/50');
        return;
      }

      try {
        button.disabled = true;
        btnSpinner.classList.remove('hidden');
        btnText.textContent = "Verifying...";
        statusMsg.textContent = "";
        emailInput.classList.remove('border-red-700/50');

        // Fetch user context parameters
        const userIp = await fetchUserIp();
        const userDeviceId = getDeviceID();

        // Submit to database
        await saveEmailToFirestore(val, userIp, userDeviceId);

        if (window.EcoNowGatekeeper) {
          window.EcoNowGatekeeper.grantAccess({
            email: val,
            ipAddress: userIp,
            deviceId: userDeviceId
          });
        }

        const remoteBanStatus = window.EcoNowGatekeeper
          ? await window.EcoNowGatekeeper.refreshRemoteBanStatus({
              email: val,
              ipAddress: userIp,
              deviceId: userDeviceId
            })
          : { blocked: false };

        if (remoteBanStatus.blocked) {
          if (window.EcoNowGatekeeper) {
            window.EcoNowGatekeeper.clearAccess();
          }
          statusMsg.textContent = "Your access has been restricted.";
          button.disabled = false;
          btnSpinner.classList.add('hidden');
          btnText.textContent = "Enter Booklet";
          return;
        }

        const rect = button.getBoundingClientRect();
        document.documentElement.style.setProperty('--clip-x', `${rect.left + rect.width / 2}px`);
        document.documentElement.style.setProperty('--clip-y', `${rect.top + rect.height / 2}px`);
        overlay.classList.remove('revealed');

        setTimeout(() => {
          const nextTarget = window.EcoNowGatekeeper
            ? window.EcoNowGatekeeper.getNextTargetFromUrl()
            : 'main.html';
          window.location.href = nextTarget;
        }, 1200);
      } catch (err) {
        // If Firestore rules deny access (due to banned IP or Device ID), intercept it
        if (err.code === 'permission-denied') {
          statusMsg.textContent = "Your access has been restricted.";
        } else {
          statusMsg.textContent = err?.message || "Unable to save email.";
        }
        button.disabled = false;
        btnSpinner.classList.add('hidden');
        btnText.textContent = "Enter Booklet";
      }
    });

    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('border-red-700/50');
      statusMsg.textContent = "";
    });
  </script>
</body>

</html>
