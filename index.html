<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoNow 25/26 — Handover Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,600;1,18..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241d15;
    --oil:#3c2f20;
    --wick:#150f0a;
    --wax:#c07a2e;
    --wax-light:#e3a758;
    --wax-pale:#f2c98a;
    --sage:#6d7a56;
    --sage-dark:#4d5940;
    --paper:#ece2cd;
    --paper-deep:#ddcfae;
    --cream:#f6efdf;
    --receipt:#fbf6ea;
    --line:rgba(36,29,21,0.16);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Literata',serif;
    font-size:17px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--wax-pale);color:var(--ink);}

  h1,h2,h3,.label{
    font-family:'Big Shoulders Display',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }

  .mono{font-family:'Space Mono',monospace;}

  a{color:var(--sage-dark);}

  /* ---------- burn rail (scroll progress) ---------- */
  #burnRail{
    position:fixed;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:220px;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #burnRail .flame{
    width:8px;height:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 30%, #fff2c9, var(--wax-light) 60%, var(--wax) 100%);
    box-shadow:0 0 8px 2px rgba(224,164,80,0.55);
    margin-bottom:2px;
    flex-shrink:0;
  }
  #burnRail .stick{
    width:6px;
    flex:1;
    background:linear-gradient(var(--wax-pale), var(--cream));
    border:1px solid var(--line);
    border-radius:3px;
    position:relative;
    overflow:hidden;
  }
  #burnRail .stick .burned{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--wick);
    height:0%;
    transition:height 0.15s linear;
  }
  @media (max-width:900px){ #burnRail{display:none;} }

  /* ---------- liquid glass nav ---------- */
  .brand-header{
    position:fixed;
    top:20px; left:20px;
    font-weight:700;
    font-size:1.2rem;
    z-index:201;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }

  .liquid-nav{
    position:fixed;
    z-index:200;
    top:18px;
    right:20px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .glass-btn{
    padding:10px 20px;
    border-radius:999px;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    background-color:color-mix(in srgb, var(--wax-pale) 16%, transparent);
    backdrop-filter:blur(9px) saturate(160%);
    -webkit-backdrop-filter:blur(9px) saturate(160%);
    border:1px solid rgba(255,255,255,0.3);
    transition:all 0.2s;
  }
  .glass-btn:hover{background-color:color-mix(in srgb, var(--wax-pale) 30%, transparent);}

  .burger{
    display:none;
    padding:10px;
    border-radius:50%;
  }

  @media (max-width:768px){
    .desktop-links{display:none;}
    .burger{display:block;}
  }

  /* ... remaining styles from provided css ... */
  /* (Skipping full copy for brevity, rest is same as provided) */
  .hero{background:radial-gradient(ellipse at 20% -10%, rgba(224,164,80,0.35), transparent 55%), var(--ink); color:var(--paper); padding:120px 0 90px; position:relative; overflow:hidden;}
  .wrap{max-width:760px;margin:0 auto;padding:0 28px;}
  .kicker{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--wax-light);margin:0 0 26px;}
  .hero h1{font-size:clamp(38px, 7vw, 68px);font-weight:900;line-height:0.98;margin:0 0 30px;}
  .hero h1 em{font-style:normal;color:var(--wax-light);}
  .hero p.lede{font-family:'Literata',serif;font-size:19px;max-width:46ch;color:var(--paper-deep);margin:0 0 40px;}
  .stamp{display:inline-flex;align-items:center;gap:14px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--paper-deep);border:1px solid rgba(236,226,205,0.28);padding:10px 16px;border-radius:2px;}
  .stamp .dot{width:6px;height:6px;border-radius:50%;background:var(--wax);}
</style>
</head>
<body>

<div class="brand-header" id="brandHeader">EcoNow 25/26</div>

<nav class="liquid-nav">
  <div class="desktop-links" style="display:flex;gap:10px;">
    <a class="glass-btn" href="index.html">Home</a>
    <a class="glass-btn" href="history/">History</a>
  </div>
  <button class="glass-btn burger">Menu</button>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <p class="kicker">EcoNow · Operational Manager Handover · 25/26 → 26/27</p>
    <h1>You don't know<br>what you <em>don't</em> know.</h1>
    <p class="lede">Notes passed down from one OM to the next.</p>
    <span class="stamp"><span class="dot"></span>For the incoming Operational Manager</span>
  </div>
</header>

<script>
  window.addEventListener('scroll', () => {
    document.getElementById('brandHeader').style.opacity = window.scrollY > 50 ? '0' : '1';
  });
</script>
</body>
</html>
