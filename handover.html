<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoNow 25/26 — Handover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,600;1,18..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241d15;
    --oil:#3c2f20;
    --wick:#150f0a;
    --wax:#c07a2e;
    --wax-light:#e3a758;
    --wax-pale:#f2c98a;
    --sage:#6d7a56;
    --sage-dark:#4d5940;
    --paper:#ece2cd;
    --paper-deep:#ddcfae;
    --cream:#f6efdf;
    --receipt:#fbf6ea;
    --line:rgba(36,29,21,0.16);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Literata',serif;
    font-size:17px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .liquid-nav{
    position:fixed;
    z-index:200;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:2px;
    padding:6px;
    border-radius:999px;
    background-color:color-mix(in srgb, var(--wax-pale) 16%, transparent);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--cream) 14%, transparent),
      inset 1.6px 2.6px 0px -2px color-mix(in srgb, var(--cream) 75%, transparent),
      inset -2px -2px 0px -2px color-mix(in srgb, var(--cream) 55%, transparent),
      inset -0.4px -1px 4px 0px color-mix(in srgb, var(--wick) 30%, transparent),
      inset 0px 3px 4px -2px color-mix(in srgb, var(--wick) 24%, transparent),
      0px 10px 26px -6px rgba(0,0,0,0.5);
  }
  .liquid-nav__indicator{
    position:absolute;
    top:6px; bottom:6px; left:0;
    width:0;
    border-radius:999px;
    background-color:color-mix(in srgb, var(--wax) 60%, transparent);
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--wax-light) 40%, transparent),
      0 2px 8px -2px rgba(0,0,0,0.4);
    transform:translateX(0);
    transition:transform 420ms cubic-bezier(0.65,0,0.35,1), width 420ms cubic-bezier(0.65,0,0.35,1);
    z-index:1;
    pointer-events:none;
  }
  .liquid-nav__link{
    position:relative;
    z-index:2;
    padding:10px 22px;
    border-radius:999px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    white-space:nowrap;
    color:var(--paper-deep);
    text-decoration:none;
    transition:color 220ms ease;
  }
  .liquid-nav__link:hover{color:#fff;}
  .liquid-nav__link.active{color:var(--ink); font-weight:700;}
  .wrap{max-width:760px;margin:0 auto;padding:0 28px;}
  section{padding:88px 0;}
  .dark{background:var(--ink);color:var(--paper);}
  .dark .wrap{color:var(--paper);}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--wax);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--wax);}
  h2.section-title{
    font-size:clamp(30px, 4.5vw, 44px);
    font-weight:700;
    line-height:1.02;
    margin:0 0 10px;
  }
  .section-sub{
    font-family:'Literata',serif;
    font-style:italic;
    color:var(--oil);
    opacity:0.75;
    font-size:16px;
    margin:0 0 44px;
  }
  .closing{
    background:var(--ink);
    color:var(--paper);
    text-align:center;
    padding:110px 0 90px;
  }
  .seal{
    width:96px;height:96px;
    border-radius:50%;
    border:2px solid var(--wax);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 30px;
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;
    font-size:22px;
    color:var(--wax-light);
  }
  footer{
    background:var(--ink);
    color:var(--paper-deep);
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    padding:22px 0 34px;
    opacity:0.6;
  }
</style>
</head>
<body data-page="handover">

<nav class="liquid-nav" id="liquidNav" aria-label="Page navigation">
  <a class="nav-brand" href="background.html" id="navBrand" aria-label="EcoNow — go to home">
    <span class="nav-brand__word">EcoNow</span>
  </a>
  <div class="liquid-nav__indicator" id="navIndicator"></div>
  <a class="liquid-nav__link" href="background.html" data-page="background">Background</a>
  <a class="liquid-nav__link" href="ceiling.html" data-page="ceiling">Ceiling</a>
  <a class="liquid-nav__link" href="handover.html" data-page="handover">Handover</a>
</nav>

<section id="plan" style="margin-top: 80px;">
  <div class="wrap">
    <p class="eyebrow">04 — My Term</p>
    <h2 class="section-title">My 25/26 Plan</h2>
  </div>
</section>

<section id="craft">
  <div class="wrap">
    <p class="eyebrow">05 — Craft Notes</p>
    <h2 class="section-title">Candle Knowledge</h2>
  </div>
</section>

<section class="dark" id="ahead">
  <div class="wrap">
    <p class="eyebrow">06 — Handing It Forward</p>
    <h2 class="section-title">Extending the Plan</h2>
  </div>
</section>

<section class="closing" id="close">
  <div class="wrap">
    <div class="seal">EN</div>
    <h2>Good Luck</h2>
  </div>
</section>

<footer>EcoNow · Handover Report · Page 3 of 3</footer>

<script>
  (function(){
    var nav = document.getElementById('liquidNav');
    var indicator = document.getElementById('navIndicator');
    var page = document.body.getAttribute('data-page');
    var links = Array.prototype.slice.call(nav.querySelectorAll('.liquid-nav__link'));
    function moveIndicator(link){
      indicator.style.width = link.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + link.offsetLeft + 'px)';
    }
    var active = null;
    links.forEach(function(l){
      if(l.dataset.page === page){ l.classList.add('active'); active = l; }
    });
    if(active) moveIndicator(active);
  })();
</script>

</body>
</html>
